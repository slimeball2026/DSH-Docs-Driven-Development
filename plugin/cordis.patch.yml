# 文档驱动开发（DDD）· M0 引擎 —— **全局挂载**（S1）。
#
# 只 insert 一行纯插件行，**不创建 preset**。
# 判据（decoupling.test.js 静态检查）：本文件不得出现 dsh-agent-preset 字样
# ——连注释里也不能写，因为 M0-14 的验收是"全文不含"。
#
# 为什么是全局而不是 preset（S1，已冻结，别再改回去）：
#   1. 插件管的对象是**项目**，不是会话模式。docs/ 存不存在、必读清单是什么，
#      与用户在标准模式还是别的模式里干活无关。
#   2. 做成 preset 会缩小覆盖：标准模式下的会话看不到它，日常干活时它等于不存在。
#   3. **门禁可被绕过**：切回标准模式就没了。能靠换模式逃掉的约束，本质上还是提示词。
#
# 全局挂载的代价用两条对冲（都在本插件内部实现，不是靠这里配置）：
#   - 激活标记（SPEC §4.3）：没有标记 → 整个插件对该项目 no-op，不会误伤普通仓库。
#   - 子代理排除（SPEC §4.4）：session.header.origin === 'subagent' → 完全 no-op。
#
# M0 一个新增工具都不加（Q13 = A），所以全局挂载没有工具 schema 的固定 token 开销。

- insert:
    - id: ddd-engine
      name: '@local/ddd'
